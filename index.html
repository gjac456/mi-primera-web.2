
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi primera página web</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
            color: #333;
        }

        header {
            background: #2457a7;
            color: white;
            text-align: center;
            padding: 35px;
        }

        nav {
            background: #183d75;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 15px;
            text-decoration: none;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
        }

        img {
            width: 100%;
            border-radius: 10px;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #2457a7;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>Bienvenidos a mi página web</h1>
        <p>Un espacio para compartir información</p>
    </header>

    <nav>
        <a href="#inicio">Inicio</a>
        <a href="#informacion">Información</a>
        <a href="#contacto">Contacto</a>
    </nav>

    <main>
        <section id="inicio">
            <h2>Inicio</h2>
            <p>Esta es mi primera página web.</p>
            <img src="https://placehold.co/900x350?text=Mi+imagen"
                 alt="Imagen de ejemplo">
        </section>

        <section id="informacion">
            <h2>Información</h2>
            <p>Aquí puedes escribir toda la información que quieras compartir.</p>
        </section>

        <section id="contacto">
            <h2>Contacto</h2>
            <p>Escribe aquí tus datos de contacto.</p>
        </section>
    </main>

    <footer>
        Mi primera página web
    </footer>

</body>
</html>
